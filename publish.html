<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布文章 - 小B书</title>
    <link rel="stylesheet" href="/styles/common.css">
    <link rel="stylesheet" href="/styles/publish.css">
    <link rel="stylesheet" href="/styles/feedback.css">
    <script type="module" src="/scripts/publish.js"></script>
</head>
<body class="publish-page">
    <header class="editor-header">
        <div class="editor-identity"><a class="editor-brand" href="/index.html">小B书</a><span class="editor-divider"></span><span>创作中心</span></div>
        <nav aria-label="创作导航"><a href="/index.html"><span data-icon="home"></span>返回首页</a></nav>
    </header>
    <aside class="creator-sidebar" aria-label="创作中心导航">
        <a class="creator-publish" href="/publish.html" aria-current="page"><span data-icon="write"></span>发布文章</a>
        <nav>
            <a href="/index.html?feed=mine"><span data-icon="article"></span>我的文章</a>
            <a href="/index.html?feed=favorites"><span data-icon="bookmark"></span>我的收藏</a>
            <a href="/index.html"><span data-icon="discover"></span>发现文章</a>
        </nav>
        <a class="creator-home" href="/index.html">小B书<span>biliblog</span></a>
    </aside>
    <div class="creator-workspace">
        <div class="creator-tabs"><a href="/publish.html" aria-current="page">图文发布</a></div>
    <main class="editor-main">
        <div class="editor-heading"><h1>发布文章</h1><span id="author-name"></span></div>
        <p id="publish-message" class="message" role="status" tabindex="-1">正在确认登录状态</p>
        <div class="login-actions" id="login-actions" hidden>
            <a href="/login.html" target="_blank" rel="noopener">去登录</a>
            <button id="check-login" type="button">重新确认登录</button>
        </div>
        <form id="publish-form">
            <fieldset id="editor-fields" disabled>
                <legend class="visually-hidden">文章内容</legend>
                <label for="article-title">标题</label>
                <input id="article-title" name="title" required maxlength="100" placeholder="给文章起个名字">
                <label for="article-body">正文</label>
                <textarea id="article-body" name="body" required maxlength="12000" rows="10" placeholder="记录今天的学习和生活"></textarea>
                <div class="field-caption"><span id="body-count">0 / 12000</span></div>
                <label>话题 <span class="optional">选填</span></label>
                <div id="tags-field" class="tags-field" role="group" aria-label="话题标签">
                    <div id="tags-chips" class="tags-chips"></div>
                    <input id="tags-text" class="tags-text-input" type="text" placeholder="输入话题，按空格或回车确认" maxlength="20" autocomplete="off" aria-label="输入话题" />
                </div>
                <input id="article-tags" name="tags" type="hidden" />
                <p id="tags-hint" class="field-hint">最多 5 个，每个不超过 20 个字符</p>
                <div class="image-heading"><label for="article-images">图片 <span class="optional">选填</span></label><span id="image-count">0 / 9</span></div>
                <div class="image-tools">
                    <label class="image-select" for="article-images"><span data-icon="image"></span>添加图片</label>
                    <input id="article-images" class="file-input" type="file" accept="image/jpeg,image/png,image/webp" multiple>
                    <button id="upload-selected" type="button" disabled>上传选中图片</button>
                    <button id="open-library" type="button">已上传图片</button>
                </div>
                <p class="field-hint">JPEG、PNG 或 WebP，每张不超过 5 MiB，上传图片为公开可见</p>
                <p id="upload-status" class="message" role="status" tabindex="-1"></p>
                <div id="image-previews" class="image-previews"></div>
                <div class="editor-actions"><button id="publish-button" class="publish-button" type="submit"><span data-icon="send"></span>发布文章</button></div>
            </fieldset>
        </form>
        <section id="publish-uncertain" class="uncertain-panel" hidden aria-label="核对发布结果">
            <p>发布结果尚未确认，请先核对我的文章，避免重复发布</p>
            <a href="/index.html?feed=mine" target="_blank" rel="noopener">查看我的文章</a>
            <button id="retry-publish" type="button">确认未发布，允许重新提交</button>
        </section>
    </main>
    <footer class="creator-footer">小B书 · biliblog<span class="footer-copy">© 2026 Octorange</span></footer>
    </div>
    <dialog id="media-dialog" aria-labelledby="media-title">
        <div class="media-heading"><h2 id="media-title">已上传图片</h2><button id="close-library" class="icon-button" type="button" aria-label="关闭素材库" title="关闭"><span data-icon="close"></span></button></div>
        <p id="media-status" role="status"></p>
        <div id="media-list" class="media-list"></div>
        <div class="media-pagination"><button id="media-previous" type="button" aria-label="上一页素材" title="上一页"><span data-icon="previous"></span></button><span id="media-page"></span><button id="media-next" type="button" aria-label="下一页素材" title="下一页"><span data-icon="next"></span></button><button id="media-refresh" type="button">刷新</button></div>
    </dialog>
</body>
</html>
