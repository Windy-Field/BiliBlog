<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>资料设置 - 小B书</title>
  <link rel="stylesheet" href="/styles/common.css" />
  <link rel="stylesheet" href="/styles/publish.css" />
  <link rel="stylesheet" href="/styles/settings.css" />
  <link rel="stylesheet" href="/styles/feedback.css" />
  <link rel="stylesheet" href="/styles/notifications.css" />
  <script type="module" src="/scripts/notifications.js"></script>
  <script type="module" src="/scripts/creator-account.js"></script>
  <script type="module" src="/scripts/settings.js"></script>
</head>
<body class="publish-page settings-page">
  <header class="editor-header">
    <div class="editor-identity">
      <a class="editor-brand" href="/index.html">小B书</a>
      <span class="editor-divider" aria-hidden="true"></span>
      <span>个人设置</span>
    </div>
    <nav aria-label="创作导航">
      <button class="notification-bell" data-notifications type="button" aria-label="消息通知" title="消息通知" aria-haspopup="dialog"><span data-icon="bell"></span><span class="notification-badge" hidden></span></button>
      <a href="/index.html"><span data-icon="home"></span>返回首页</a>
    </nav>
  </header>
  <aside class="creator-sidebar" aria-label="设置导航">
    <a class="creator-publish" href="/settings.html" aria-current="page"><span data-icon="user"></span>资料设置</a>
    <nav>
      <a href="/index.html?feed=mine"><span data-icon="article"></span>我的文章</a>
      <a href="/publish.html"><span data-icon="write"></span>发布文章</a>
      <a href="/index.html?feed=favorites"><span data-icon="bookmark"></span>我的收藏</a>
      <a href="/index.html?feed=likes"><span data-icon="heart"></span>点赞历史</a>
      <a href="/index.html"><span data-icon="discover"></span>发现文章</a>
    </nav>
    <a class="creator-home" href="/index.html">小B书<span>biliblog</span></a>
  </aside>
  <div class="creator-workspace">
    <nav class="creator-tabs" aria-label="设置页面"><a href="/settings.html" aria-current="page">资料设置</a></nav>
    <main class="editor-main">
      <div class="editor-heading">
        <h1>资料设置</h1>
      </div>
      <p id="settings-message" class="message" role="status" tabindex="-1"></p>
      <form id="settings-form" novalidate>
        <fieldset id="settings-fields" disabled>
          <legend class="visually-hidden">资料信息</legend>
          <section class="settings-section">
            <h2>基本资料</h2>
            <div class="image-field">
              <label>头像</label>
              <div class="avatar-editor">
                <div class="avatar-editor-wrap">
                  <div id="avatar-preview" class="avatar-preview" aria-hidden="true"></div>
                  <label class="avatar-overlay" for="avatar-input" aria-label="更换头像">
                    <span data-icon="image"></span>
                  </label>
                  <input id="avatar-input" class="file-input" type="file" accept="image/jpeg,image/png,image/webp" />
                </div>
                <div class="avatar-editor-hint">
                  <p class="image-hint-title">更换头像</p>
                  <p class="image-hint-desc">支持 JPEG、PNG、WebP，最大 5 MB</p>
                  <p id="avatar-status" class="message" role="status" tabindex="-1"></p>
                </div>
              </div>
            </div>
            <div class="image-field">
              <label>封面图</label>
              <div class="cover-editor">
                <div class="cover-editor-wrap">
                  <div id="cover-preview" class="cover-preview" aria-hidden="true"></div>
                  <label class="cover-overlay" for="cover-input" aria-label="更换封面">
                    <span data-icon="image"></span>更换封面
                  </label>
                  <input id="cover-input" class="file-input" type="file" accept="image/jpeg,image/png,image/webp" />
                </div>
                <button id="remove-cover" type="button" class="cover-remove-btn" hidden>删除封面</button>
              </div>
              <p id="cover-status" class="message" role="status" tabindex="-1"></p>
            </div>
            <label for="display-name">昵称</label>
            <input id="display-name" name="displayName" type="text" required maxlength="40" autocomplete="nickname" />
            <label for="bio">个人简介 <span class="optional">选填</span></label>
            <textarea id="bio" name="bio" maxlength="500" rows="3" placeholder="介绍一下自己吧"></textarea>
          </section>
          <section class="settings-section">
            <h2>主页展示</h2>
            <label for="headline">标语 <span class="optional">选填</span></label>
            <input id="headline" name="headline" type="text" maxlength="80" placeholder="一句话描述自己" />
            <label for="about-md">关于我 <span class="optional">选填，支持 Markdown</span></label>
            <textarea id="about-md" name="aboutMarkdown" maxlength="5000" rows="8" placeholder="详细介绍你的经历、技术栈或创作方向……"></textarea>
          </section>
          <section class="settings-section">
            <div class="section-head">
              <h2>个人链接 <span class="optional">选填，最多 5 条</span></h2>
              <button id="add-link" type="button">+ 添加链接</button>
            </div>
            <div id="links-list" class="links-list"></div>
          </section>
          <div class="form-actions">
            <button id="save-button" class="publish-button" type="submit">
              <span data-icon="send"></span>保存资料
            </button>
          </div>
        </fieldset>
      </form>
    </main>
    <footer class="creator-footer">小B书 · biliblog<span class="footer-copy">© 2026 Octorange</span></footer>
  </div>
</body>
</html>
